# Default values for yurt-manager.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# settings for log print
log:
  # log level for yurt-manager
  level: 4

replicaCount: 1
nameOverride: ""

image:
  registry: openyurt
  repository: yurt-manager
  tag: ""
  pullSecrets: []
  # pullSecrets:
  #   - name: myRegistryKeySecretName

ports:
  metrics: 10271
  healthProbe: 10272
  webhook: 10273

# format should be "foo,-bar,*"
controllers: "-nodelifecycle,*"

# format should be "foo,*"
disableIndependentWebhooks: ""

leaderElectResourceName: "cloud-yurt-manager"

nodeServant:
  image:
    registry: openyurt
    repository: node-servant
    tag: "latest"

yurthub:
  # Extra components (by user-agent) whose responses yurthub should cache, on top
  # of its built-in defaults. Comma-separated.
  cacheAgents: ""

  # Extra components (by user-agent) that should have their EndpointSlice
  # addresses rewritten to the pod addresses actually live on the node, while the
  # cloud is unreachable. Comma-separated.
  #
  # kube-proxy and coredns are built-in defaults of the livepodip filter and do
  # NOT need listing here. An ingress controller does, because its user-agent is
  # deployment-specific -- and it matters: after a disconnected reboot an ingress
  # controller with stale addresses returns 502 for every route.
  #
  # Set this rather than patching the ConfigMap after install. A post-install
  # patch can land AFTER the ingress controller has completed its first LIST, in
  # which case that LIST is unfiltered and the controller keeps a stale view
  # until its watch expires -- an ordering race that is easy to lose by seconds.
  #
  # Example: livePodIPAgents: "traefik"
  livePodIPAgents: ""

# support extra args of yurt-manager cmd
extraArgs: []

# resources of yurt-manager container
resources:
  limits:
    cpu: 2000m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 256Mi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
